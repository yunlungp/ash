name: Auto Increment Version and Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # 1. 配置 Git 身份（用于后续自动提交更新后的版本号）
    - name: Configure Git User
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    # 2. 运行 Python 脚本自动升级版本号
    - name: Increment Version
      run: python .github/scripts/increment_version.py

    # 3. 提交版本号变更回仓库 (先拉取最新远端提交，防止冲突)
    - name: Commit Version Bump
      run: |
        git add pubspec.yaml
        if ! git diff --quiet --cached; then
          git commit -m "chore: auto-increment version number [skip ci]"
          git pull --rebase origin main
          git push origin main
        fi

    # 4. 设置 Java 环境（打包 Android 需要）
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 5. 设置 Flutter 环境
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    # 6. 获取依赖并打包 Release APK
    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    # 7. 上传编译好的 APK 到 GitHub Actions 产物中
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    # 8. 读取最新版本号并自动发布 GitHub Release (方便 App 在线检查和下载)
    - name: Read Version
      id: get_version
      run: |
        VERSION=$(grep 'version:' pubspec.yaml | head -n 1 | awk '{print $2}')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        body: |
          Ash Bound 自动构建版本更新 v${{ steps.get_version.outputs.version }}
        files: build/app/outputs/flutter-apk/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
